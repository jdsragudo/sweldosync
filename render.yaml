services:
  - type: web
    name: sweldosync
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: STELLAR_NETWORK
        value: testnet
      - key: DATA_DIR
        value: ./data
      - key: ADMIN_TOKEN
        sync: false
      - key: AGENT_SECRET_KEY
        sync: false
      - key: OWNER_SECRET_KEY
        sync: false
      - key: NOIR_DEVICE_REGISTRY_CONTRACT_ID
        sync: false
      - key: NOIR_AGENT_REGISTRY_CONTRACT_ID
        sync: false
      - key: NOIR_PAYMENT_ESCROW_CONTRACT_ID
        sync: false
      - key: NOIR_NATIVE_SAC_CONTRACT_ID
        sync: false
